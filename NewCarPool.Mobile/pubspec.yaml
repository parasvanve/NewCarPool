name: new_car_pool
description: NewCarPool mobile application built with Flutter, Provider, Dio, Flutter Map, SignalR, and JWT authentication.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.2
  go_router: ^14.8.1
  dio: ^5.7.0
  flutter_secure_storage: ^9.2.2
  flutter_map: ^8.0.0
  google_maps_flutter: ^2.12.3
  latlong2: ^0.9.1
  signalr_netcore: ^1.4.3
  geolocator: ^14.0.2
  intl: ^0.19.0
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
